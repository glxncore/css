<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="login.css" />
  </head>
  <body>
    <div class="mainbg">
      <div class="colorbg">
      </div>
      <div class="form1">
        <form action="">
          <h3>Login Form</h3>
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" required  class="enhancer"/>
          <label for="password">Password:</label>
          <input type="text" id="PASSWORD" name="password" required class="enhancer">
          <input type="checkbox" name="checkbox" />
          <label for="checkbox">Remember Me</label><br>
          <button type="submit" class="logbtn">Login </button>
        </form>
      </div>
    </div>
  </body>
</html>
